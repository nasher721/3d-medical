<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Anatomy renderer verification harness</title><style>body{margin:0;background:#0a1019;color:#e4eef7;font:14px system-ui}header{padding:12px}canvas{width:100%;height:65vh;display:block}button,select{font:inherit;padding:8px}#labels{padding:12px;max-height:20vh;overflow:auto}#result{white-space:pre-wrap}</style><header>Educational schematic anatomy verification <select id="view" aria-label="Organ view"><option>brain</option><option>kidneys</option><option>lungs</option><option>whole</option></select> <button id="glass">Toggle selected shell</button> <button id="flow">Set zero flow</button><output id="status"></output></header><canvas id="scene" tabindex="0"></canvas><div id="labels"></div><pre id="result"></pre><script type="module">
import {AnatomyRenderer} from '/src/anatomy.js';
const canvas=document.querySelector('#scene'),labels=document.querySelector('#labels');
const renderer=new AnatomyRenderer(canvas);await renderer.ready;renderer.setView('brain');
let zero=false;const metrics={hr:72,co:5,map:88,cvp:6,spo2:98,svo2:70,edv:120,renalFlow:900,brainFlow:50,urineOutput:60,cerebralTerritories:{aca:12.5,mca:25,pca:12.5}};
const render=()=>{renderer.update(metrics,.033);labels.textContent=renderer.getLabels().map(l=>l.text).join(' | ');document.querySelector('#status').textContent=zero?'■ No flow':'→ Baseline flow';document.querySelector('#result').textContent=JSON.stringify({registered:!!renderer.registeredVasculature,sourceVessels:renderer.assets.filter(a=>a.sourceVessel).length,error:renderer.vascularAssetError||null,finite:renderer.particleArrays.position.every(Number.isFinite),glError:renderer.gl.getError(),zeroFlow:zero,allRatesZero:renderer.routes.every(r=>renderer._routeRate(r)===0)});requestAnimationFrame(render);};render();
document.querySelector('#view').onchange=e=>renderer.setView(e.target.value);
document.querySelector('#glass').onclick=()=>{const key=renderer.view;if(key==='whole')return;renderer.setLayers({opacity:{[key]:renderer.layers.opacity[key]<1?1:.15}});};
document.querySelector('#flow').onclick=e=>{zero=!zero;Object.assign(metrics,{co:zero?0:5,brainFlow:zero?0:50,renalFlow:zero?0:900,urineOutput:zero?0:60,cerebralTerritories:{aca:zero?0:12.5,mca:zero?0:25,pca:zero?0:12.5}});e.target.textContent=zero?'Restore baseline flow':'Set zero flow';};
window.anatomyEvidence=()=>({assetSource:renderer.assetSource,registered:renderer.registeredVasculature,vascularAssetError:renderer.vascularAssetError,sourceVessels:renderer.assets.filter(a=>a.sourceVessel).length,view:renderer.view,opacity:{...renderer.layers.opacity},routes:renderer.routes.map(r=>({name:r.name,group:r.group,semantic:r.semantic,phase:r.phase,rate:renderer._routeRate(r)})),labels:renderer.getLabels(),finite:renderer.particleArrays.position.every(Number.isFinite),glError:renderer.gl.getError()});
</script></html>
